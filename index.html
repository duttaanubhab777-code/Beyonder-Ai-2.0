<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beyonder AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body class="checking-auth">

    <div class="bg-glow"></div>

    <nav class="ai">
        <div class="logo-circle">
            <span id="logo"><i class="fa-solid fa-atom"></i></span>
        </div>
        <h1>Beyonder <span>AI</span></h1>

        <div class="nav-actions">
            <button id="new-chat-btn" class="icon-btn" title="New chat" aria-label="Start a new chat">
                <i class="fa-solid fa-plus"></i>
            </button>
            <button id="theme-toggle-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle dark or light theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </nav>

    <div class="chat-area" id="chat-area"></div>

    <div class="chat-input-area">
        <textarea id="user-input" placeholder="Ask Beyonder" rows="1"></textarea>
        <button id="send-btn" class="send-button" aria-label="Send message">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

    <p class="credit">Created by Anubhab Dutta & Arnab Adhikari</p>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    

    <script src="app.js"></script>
</body>
</html>
