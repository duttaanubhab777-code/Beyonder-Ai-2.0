<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Admin Login — Beyonder AI</title>
<style>
    body {
        background: #0d1117;
        color: #e6e6e6;
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }
    .box {
        background: #161b22;
        padding: 40px;
        border-radius: 12px;
        width: 320px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; }
    input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 6px;
        border: 1px solid #30363d;
        background: #0d1117;
        color: #e6e6e6;
        box-sizing: border-box;
    }
    button {
        width: 100%;
        padding: 10px;
        background: linear-gradient(90deg, #6366f1, #06b6d4);
        border: none;
        border-radius: 6px;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }
    .error { color: #f87171; margin-top: 10px; }
</style>
</head>
<body>
    <div class="box">
        <h2>🔒 Admin Login</h2>
        <form method="POST" action="/admin/login">
            <input type="password" name="password" placeholder="Admin password" required autofocus>
            <button type="submit">Login</button>
        </form>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
